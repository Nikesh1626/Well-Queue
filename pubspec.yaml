name: well_queue_2026
description: "WellQueue - Smart clinic queue and appointment management app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0

  # Supabase & Database
  supabase_flutter: ^1.10.0
  postgrest: ^1.4.0

  # Authentication
  flutter_secure_storage: ^9.0.0

  # Geolocation & Maps
  geolocator: ^10.0.0
  permission_handler: ^11.4.0
  google_maps_flutter: ^2.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.1.0

  # Notifications & Local Storage
  flutter_local_notifications: ^17.2.4
  shared_preferences: ^2.2.0

  # State Management
  provider: ^6.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  dio: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  sign_in_with_apple: ^7.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
